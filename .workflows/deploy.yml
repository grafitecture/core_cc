name: Deploy via rsync zu comvos

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # zusätzlich manuell startbar

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH einrichten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SFTP_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Dateien synchronisieren
        run: |
          rsync -avz --delete \
            --exclude-from='.rsyncignore' \
            -e "ssh -p ${{ secrets.SFTP_PORT }} -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}:/home/corecc/public_html/
            
